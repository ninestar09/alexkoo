<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALEX KOO — Play</title>
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/css/blackbox-hero.css" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      background: #050506;
      color: #8b8a87;
      font: 11px/1.6 ui-monospace, "Cascadia Mono", Menlo, monospace;
    }
    #hero {
      width: 100%;
      height: 100vh;
    }
    .below {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      border-top: 1px solid rgba(232, 230, 226, 0.06);
      padding: 2rem 1rem;
      text-align: center;
    }
    .below a {
      color: #c8c6c1;
      letter-spacing: 0.18em;
      text-decoration: none;
      border-bottom: 1px solid rgba(232, 230, 226, 0.22);
      padding-bottom: 2px;
    }
    .below a:hover { color: #fff; }
  </style>
</head>
<body>
  <div id="hero" aria-label="Interactive cube hero play variant"></div>
  <section class="below">
    <div>Tap nodes · cube · field for popups · drag to move</div>
    <a href="alexintro.html">Back to classic intro</a>
  </section>
  <script type="module">
    import { mountBlackboxHero } from "./assets/js/blackbox-hero.js";
    mountBlackboxHero(document.getElementById("hero"), {
      title: "ALEX KOO",
      dynamicColor: true,
      colorSpeed: 0.28,
      colorAmp: 0.9,
      popups: true,
      popupLife: 3.4,
      iridescence: 1.25,
      iridSpread: 1,
      glint: 0.48,
    });
  </script>
</body>
</html>
